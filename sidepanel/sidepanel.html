<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>Tab Harbor · 标签港湾</title>
  <link rel="stylesheet" href="../styles/base.css?v=10">
  <link rel="stylesheet" href="sidepanel.css?v=10">
  <script src="../shared/i18n.js?v=10"></script>
  <script src="../shared/mock-chrome.js?v=10"></script>
  <script src="../shared/store.js?v=10"></script>
</head>

<body>
  <div class="sp">
    <header class="sp__head">
      <span class="sp__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.5 3v8H4.8L10.5 3Z"/><path d="M13 5.5V11h4.6L13 5.5Z"/><path d="M4 14h16l-2.4 3.6H6.4L4 14Z"/></svg>
      </span>
      <strong class="sp__name">标签港湾</strong>
      <button class="iconbtn" id="spManager" title="打开完整管理页">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/></svg>
      </button>
    </header>

    <div class="sp__search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="spSearch" type="text" placeholder="搜索分组…" autocomplete="off">
    </div>

    <div id="spGroups" class="sp__groups"></div>
    <p class="sp__empty" id="spEmpty" hidden>还没有保存的分组,点击右上角图标打开管理页。</p>
  </div>

  <script src="sidepanel.js?v=10"></script>
</body>
</html>
